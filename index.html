  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};

    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');
      }

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ve {\n    background: var(--purple);\n    color: white;\n    border-radius: 8px;\n  }\n\n  /* ── HERO ── */\n  .hero {\n    background: linear-gradient(135deg, var(--dark) 0%, #2A1560 55%, #153060 100%);\n    padding: 56px 32px 52px;\n    text-align: center;\n    position: relative;\n    overflow: hidden;\n  }\n\n  .hero::before {\n    content: '';\n    position: absolute;\n    top: -80px; right: -80px;\n    width: 320px; height: 320px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(107,43,214,0.35) 0%, transparent 70%);\n    pointer-events: none;\n  }\n\n  .hero::after {\n    content: '';\n    position: absolute;\n    bottom: -50px; left: -50px;\n    width: 250px; height: 250px;\n    border-radius: 50%;\n    background: radial-gradient(circle, rgba(0,196,180,0.25) 0%, transparent 70%);\n    pointer-events: none;\n  }\n\n  .hero-badge {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    background: rgba(0,196,180,0.15);\n    border: 1px solid rgba(0,196,180,0.35);\n    color: var(--cyan-light);\n    font-size: 13px;\n    font-weight: 600;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    padding: 6px 18px;\n    border-radius: 20px;\n    margin-bottom: 22px;\n  }\n\n  .hero h1 {\n    font-size: clamp(30px, 5vw, 52px);\n    font-weight: 700;\n    color: white;\n    margin-bottom: 14px;\n    line-height: 1.15;\n  }\n\n  .hero h1 span { color: var(--cyan-light); }\n\n  .hero-sub {\n    font-size: 18px;\n    color: rgba(255,255,255,0.68);\n    max-width: 560px;\n    margin: 0 auto 36px;\n    line-height: 1.6;\n  }\n\n  .hero-stats {\n    display: flex;\n    justify-content: center;\n    gap: 36px;\n    flex-wrap: wrap;\n  }\n\n  .stat { text-align: center; }\n  .stat-num { font-size: 30px; font-weight: 700; color: var(--cyan-light); line-height: 1; }\n  .stat-label { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 5px; }\n\n  /* ── NAV ── */\n  .nav-bar {\n    background: white;\n    border-bottom: 2px solid var(--border);\n    padding: 0 24px;\n    display: flex;\n    gap: 0;\n    overflow-x: auto;\n    scrollbar-width: none;\n    -webkit-overflow-scrolling: touch;\n  }\n\n  .nav-bar::-webkit-scrollbar { display: none; }\n\n  .nav-item {\n    padding: 14px 14px;\n    font-size: 15px;\n    font-weight: 500;\n    color: var(--text-muted);\n    cursor: pointer;\n    white-space: nowrap;\n    border-bottom: 2px solid transparent;\n    margin-bottom: -2px;\n    transition: all 0.2s;\n    display: flex;\n    align-items: center;\n    gap: 5px;\n    user-select: none;\n    -webkit-tap-highlight-color: transparent;\n  }\n\n  .nav-item:hover { color: var(--purple); background: var(--accent-bg); }\n  .nav-item.active { color: var(--purple); border-bottom-color: var(--purple); font-weight: 600; }\n\n  /* ── DRIVE BANNER ── */\n  .drive-banner {\n    background: linear-gradient(135deg, #1A1035 0%, #2A1560 100%);\n    margin: 24px 24px 0;\n    border-radius: 16px;\n    padding: 20px 28px;\n    display: flex;\n    align-items: center;\n    gap: 20px;\n    flex-wrap: wrap;\n    max-width: 812px;\n    margin-left: auto;\n    margin-right: auto;\n  }\n\n  .drive-banner-left { flex: 1; min-width: 220px; }\n  .drive-banner-title { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }\n  .drive-banner-sub { font-size: 14px; color: rgba(255,255,255,0.6); }\n\n  .btn-drive {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    background: var(--cyan);\n    color: #0D2020;\n    font-weight: 700;\n    font-size: 15px;\n    font-family: inherit;\n    padding: 12px 24px;\n    border-radius: 12px;\n    text-decoration: none;\n    border: none;\n    cursor: pointer;\n    transition: all 0.2s;\n    white-space: nowrap;\n    flex-shrink: 0;\n  }\n\n  .btn-drive:hover { background: var(--cyan-light); transform: translateY(-1px); }\n\n  /* ── MAIN ── */\n  main {\n    max-width: 860px;\n    margin: 0 auto;\n    padding: 24px 20px 80px;\n    display: flex;\n    flex-direction: column;\n    gap: 14px;\n  }\n\n  /* ── SECTION CARDS ── */\n  .section-card {\n    background: white;\n    border-radius: 16px;\n    border: 1px solid var(--border);\n    overflow: hidden;\n    transition: box-shadow 0.2s;\n  }\n\n  .section-card:hover { box-shadow: 0 4px 24px rgba(107,43,214,0.09); }\n\n  .section-header {\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    padding: 22px 24px;\n    cursor: pointer;\n    user-select: none;\n    transition: background 0.15s;\n    -webkit-tap-highlight-color: transparent;\n    min-height: 72px;\n  }\n\n  .section-header:hover { background: var(--accent-bg); }\n  .section-card.open > .section-header { background: var(--accent-bg); }\n\n  .section-icon {\n    width: 48px;\n    height: 48px;\n    border-radius: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 22px;\n    flex-shrink: 0;\n  }\n\n  .icon-purple { background: var(--accent-bg); }\n  .icon-cyan   { background: #E0FAF7; }\n  .icon-blue   { background: #E6EEFF; }\n  .icon-green  { background: #E6F9F0; }\n  .icon-orange { background: #FFF4E6; }\n  .icon-red    { background: #FFE8E8; }\n  .icon-yellow { background: #FFFADC; }\n\n  .section-title-wrap { flex: 1; min-width: 0; }\n\n  .section-title {\n    font-size: 17px;\n    font-weight: 700;\n    color: var(--text);\n    line-height: 1.3;\n  }\n\n  .section-desc {\n    font-size: 14px;\n    color: var(--text-muted);\n    margin-top: 3px;\n    line-height: 1.4;\n  }\n\n  .chevron-icon {\n    width: 22px;\n    height: 22px;\n    color: var(--text-muted);\n    transition: transform 0.25s;\n    flex-shrink: 0;\n  }\n\n  .section-card.open .chevron-icon { transform: rotate(180deg); }\n\n  .section-body {\n    display: none;\n    border-top: 1px solid var(--border);\n    padding: 28px 24px;\n  }\n\n  .section-card.open > .section-body { display: block; }\n\n  /* ── CONTENT STYLES ── */\n  .content h3 {\n    font-size: 13px;\n    font-weight: 700;\n    color: var(--purple);\n    margin: 26px 0 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n  }\n\n  .content h3:first-child { margin-top: 0; }\n\n  .content p {\n    font-size: 16px;\n    color: var(--text);\n    margin-bottom: 12px;\n    text-wrap: pretty;\n  }\n\n  .content ul, .content ol {\n    padding-left: 22px;\n    margin-bottom: 14px;\n  }\n\n  .content li {\n    font-size: 16px;\n    color: var(--text);\n    margin-bottom: 8px;\n    padding-left: 4px;\n    line-height: 1.55;\n  }\n\n  .info-box {\n    background: var(--accent-bg);\n    border-left: 4px solid var(--purple);\n    border-radius: 0 10px 10px 0;\n    padding: 14px 18px;\n    margin: 16px 0;\n    font-size: 15px;\n    color: var(--text);\n    line-height: 1.55;\n  }\n\n  .info-box strong { color: var(--purple); }\n\n  .cyan-box {\n    background: #E0FAF7;\n    border-left: 4px solid var(--cyan);\n    border-radius: 0 10px 10px 0;\n    padding: 14px 18px;\n    margin: 16px 0;\n    font-size: 15px;\n    line-height: 1.55;\n  }\n\n  .cyan-box strong { color: #007A6E; }\n\n  .warn-box {\n    background: #FFF8E6;\n    border-left: 4px solid #F5A623;\n    border-radius: 0 10px 10px 0;\n    padding: 14px 18px;\n    margin: 16px 0;\n    font-size: 15px;\n    line-height: 1.55;\n  }\n\n  /* ── DOC LINK BUTTON ── */\n  .doc-link {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    margin-top: 20px;\n    padding: 10px 20px;\n    background: white;\n    border: 1.5px solid var(--purple);\n    color: var(--purple);\n    border-radius: 10px;\n    font-size: 14px;\n    font-weight: 600;\n    font-family: inherit;\n    text-decoration: none;\n    cursor: pointer;\n    transition: all 0.2s;\n  }\n\n  .doc-link:hover { background: var(--accent-bg); }\n  .doc-link svg { width: 16px; height: 16px; flex-shrink: 0; }\n\n  /* ── PROGRAM TABLE ── */\n  .program-table {\n    width: 100%;\n    border-collapse: collapse;\n    margin: 16px 0;\n    font-size: 15px;\n  }\n\n  .program-table th {\n    background: var(--dark);\n    color: white;\n    padding: 11px 14px;\n    text-align: left;\n    font-weight: 600;\n    font-size: 13px;\n  }\n\n  .program-table td {\n    padding: 13px 14px;\n    border-bottom: 1px solid var(--border);\n    vertical-align: top;\n    line-height: 1.5;\n  }\n\n  .program-table tr:last-child td { border-bottom: none; }\n  .program-table tr:nth-child(even) td { background: #FAFAFE; }\n\n  .time-badge {\n    display: inline-block;\n    background: var(--purple);\n    color: white;\n    font-size: 12px;\n    font-weight: 700;\n    padding: 4px 12px;\n    border-radius: 20px;\n    white-space: nowrap;\n  }\n\n  /* ── TASK LIST ── */\n  .task-list {\n    display: flex;\n    flex-direction: column;\n    gap: 10px;\n    margin: 16px 0;\n  }\n\n  .task-item {\n    display: flex;\n    align-items: flex-start;\n    gap: 12px;\n    background: var(--bg);\n    border-radius: 12px;\n    padding: 13px 16px;\n    font-size: 16px;\n    line-height: 1.5;\n  }\n\n  .task-num {\n    min-width: 28px;\n    height: 28px;\n    border-radius: 50%;\n    background: var(--purple);\n    color: white;\n    font-size: 13px;\n    font-weight: 700;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    margin-top: 1px;\n  }\n\n  .task-num.green { background: #1AB87A; }\n  .task-num.orange { background: #F5A623; color: #333; }\n\n  /* ── SPEAKER TIPS ── */\n  .tip-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px;\n    margin: 16px 0;\n  }\n\n  .tip-card {\n    background: var(--bg);\n    border-radius: 12px;\n    padding: 16px;\n    border: 1px solid var(--border);\n  }\n\n  .tip-card .tip-icon { font-size: 24px; margin-bottom: 8px; }\n  .tip-card h4 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }\n  .tip-card p { font-size: 14px; color: var(--text-muted); margin: 0; line-height: 1.5; }\n\n  /* ── FAQ ── */\n  .faq-item {\n    border-bottom: 1px solid var(--border);\n    padding: 14px 0;\n  }\n\n  .faq-item:last-child { border-bottom: none; }\n\n  .faq-q {\n    font-size: 15px;\n    font-weight: 700;\n    color: var(--text);\n    margin-bottom: 6px;\n    display: flex;\n    gap: 10px;\n  }\n\n  .faq-q::before {\n    content: '?';\n    width: 22px;\n    height: 22px;\n    background: var(--purple);\n    color: white;\n    border-radius: 50%;\n    font-size: 13px;\n    font-weight: 700;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n    margin-top: 1px;\n  }\n\n  .faq-a {\n    font-size: 15px;\n    color: var(--text-muted);\n    padding-left: 32px;\n    line-height: 1.55;\n  }\n\n  /* ── ABOUT GRID ── */\n  .about-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 12px;\n    margin: 16px 0;\n  }\n\n  .about-item {\n    background: var(--bg);\n    border-radius: 12px;\n    padding: 16px;\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n    border: 1px solid var(--border);\n  }\n\n  .about-item .about-icon { font-size: 24px; }\n  .about-item .about-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }\n  .about-item .about-val { font-size: 16px; font-weight: 700; color: var(--text); }\n\n  /* ── CHIPS ── */\n  .chips {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin: 12px 0;\n  }\n\n  .chip {\n    background: var(--accent-bg);\n    border: 1px solid var(--border);\n    border-radius: 20px;\n    padding: 6px 14px;\n    font-size: 14px;\n    color: var(--purple);\n    font-weight: 500;\n    line-height: 1.4;\n  }\n\n  .chip.cyan { background: #E0FAF7; border-color: #B0EDE7; color: #007A6E; }\n\n  /* ── REPORT FIELDS ── */\n  .report-field {\n    border: 1px solid var(--border);\n    border-radius: 12px;\n    padding: 14px 18px;\n    margin-bottom: 10px;\n  }\n\n  .report-field label {\n    display: block;\n    font-size: 12px;\n    font-weight: 700;\n    color: var(--text-muted);\n    text-transform: uppercase;\n    letter-spacing: 0.06em;\n    margin-bottom: 6px;\n  }\n\n  .report-field-val {\n    min-height: 36px;\n    border-bottom: 1px dashed var(--border);\n    color: var(--text-muted);\n    font-size: 15px;\n    font-style: italic;\n  }\n\n  /* ── ETHICS ── */\n  .ethics-article {\n    padding: 16px 0;\n    border-bottom: 1px solid var(--border);\n  }\n\n  .ethics-article:last-child { border-bottom: none; }\n\n  .ethics-article h4 {\n    font-size: 15px;\n    font-weight: 700;\n    color: var(--purple);\n    margin-bottom: 7px;\n  }\n\n  .ethics-article p { font-size: 15px; margin-bottom: 0; line-height: 1.55; }\n\n  /* ── HASHTAGS ── */\n  .hashtag-box {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 8px;\n    margin: 14px 0;\n  }\n\n  .hashtag {\n    background: var(--accent-bg);\n    color: var(--purple);\n    border: 1px solid var(--border);\n    border-radius: 20px;\n    padding: 6px 16px;\n    font-size: 14px;\n    font-weight: 700;\n  }\n\n  /* ── CONTACTS ── */\n  .contact-card {\n    background: linear-gradient(135deg, var(--dark) 0%, #2A1560 100%);\n    border-radius: 14px;\n    padding: 24px;\n    color: white;\n    display: flex;\n    align-items: center;\n    gap: 18px;\n    flex-wrap: wrap;\n    margin-bottom: 12px;\n  }\n\n  .contact-icon {\n    width: 50px;\n    height: 50px;\n    background: rgba(255,255,255,0.12);\n    border-radius: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 24px;\n    flex-shrink: 0;\n  }\n\n  .contact-info h4 { font-size: 17px; margin-bottom: 4px; }\n  .contact-info p { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 2px; }\n  .contact-info a { color: var(--cyan-light); text-decoration: none; font-weight: 600; }\n\n  /* ── LANG HIDDEN ── */\n  [data-lang] { display: none; }\n  [data-lang].lang-active { display: revert; }\n\n  /* ── PPTX CARD ── */\n  .pptx-card {\n    background: linear-gradient(135deg, #2A1560 0%, #153060 100%);\n    border-radius: 14px;\n    padding: 24px;\n    display: flex;\n    align-items: center;\n    gap: 20px;\n    flex-wrap: wrap;\n    margin: 16px 0;\n  }\n\n  .pptx-icon {\n    width: 56px;\n    height: 56px;\n    background: rgba(255,255,255,0.12);\n    border-radius: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 28px;\n    flex-shrink: 0;\n  }\n\n  .pptx-info { flex: 1; min-width: 180px; }\n  .pptx-info h4 { font-size: 17px; font-weight: 700; color: white; margin-bottom: 5px; }\n  .pptx-info p { font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.5; }\n\n  .btn-pptx {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    background: var(--cyan);\n    color: #0D2020;\n    font-weight: 700;\n    font-size: 15px;\n    font-family: inherit;\n    padding: 12px 22px;\n    border-radius: 12px;\n    text-decoration: none;\n    border: none;\n    cursor: pointer;\n    transition: all 0.2s;\n    white-space: nowrap;\n    flex-shrink: 0;\n  }\n\n  .btn-pptx:hover { background: var(--cyan-light); transform: translateY(-1px); }\n\n  /* ── MOBILE ── */\n  @media (max-width: 640px) {\n    header { padding: 0 16px; height: 60px; }\n    .logo-item img.logo-bridges { height: 32px; }\n    .logo-item img.logo-chevron { height: 28px; }\n    .logo-itm-icon { width: 30px; height: 30px; }\n    .logo-itm-text { font-size: 17px; }\n    .logo-divider { display: none; }\n\n    .hero { padding: 36px 18px 32px; }\n    .hero-sub { font-size: 16px; }\n    .hero-stats { gap: 20px; }\n    .stat-num { font-size: 24px; }\n\n    .nav-bar { padding: 0 12px; }\n    .nav-item { font-size: 14px; padding: 12px 10px; }\n\n    main { padding: 16px 14px 60px; gap: 12px; }\n    .section-header { padding: 18px 16px; min-height: 66px; }\n    .section-body { padding: 20px 16px; }\n    .section-icon { width: 42px; height: 42px; font-size: 20px; }\n    .section-title { font-size: 16px; }\n\n    .about-grid { grid-template-columns: 1fr; }\n    .tip-grid { grid-template-columns: 1fr; }\n\n    .drive-banner { margin: 16px 14px 0; padding: 18px; border-radius: 14px; }\n    .drive-banner-title { font-size: 16px; }\n\n    .program-table { font-size: 14px; }\n    .program-table th, .program-table td { padding: 10px 10px; }\n\n    body { font-size: 16px; }\n  }\n\n  @media (max-width: 400px) {\n    .header-logos { gap: 10px; }\n    .hero h1 { font-size: 26px; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ══ HEADER ══ -->\n<header>\n  <div class=\"header-logos\">\n    <div class=\"logo-item\">\n      <a href=\"#\" class=\"logo-itm\">\n        <svg class=\"logo-itm-icon\" viewBox=\"0 0 120 120\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n          <defs>\n            <linearGradient id=\"lg1\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"100%\">\n              <stop offset=\"0%\" stop-color=\"#1A0A6E\"><\u002Fstop>\n              <stop offset=\"40%\" stop-color=\"#6B2BD6\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#00C4B4\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <linearGradient id=\"lg2\" x1=\"100%\" y1=\"0%\" x2=\"0%\" y2=\"100%\">\n              <stop offset=\"0%\" stop-color=\"#00D4C8\"><\u002Fstop>\n              <stop offset=\"50%\" stop-color=\"#4B2BD6\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#1A0A6E\"><\u002Fstop>\n            <\u002FlinearGradient>\n            <linearGradient id=\"lg3\" x1=\"0%\" y1=\"100%\" x2=\"100%\" y2=\"0%\">\n              <stop offset=\"0%\" stop-color=\"#00C4B4\"><\u002Fstop>\n              <stop offset=\"100%\" stop-color=\"#8B2FD6\"><\u002Fstop>\n            <\u002FlinearGradient>\n          <\u002Fdefs>\n          <!-- Left arm -->\n          <path d=\"M58 18 C48 22 28 32 24 50 C20 65 32 75 44 68 C52 63 58 52 60 42 C62 52 68 63 76 68 C88 75 100 65 96 50 C92 32 72 22 62 18 C61 17 59 17 58 18Z\" fill=\"url(#lg1)\" opacity=\"0.15\"><\u002Fpath>\n          <path d=\"M30 72 C22 58 26 38 40 28 C50 20 60 22 60 22 C60 22 50 28 46 40 C42 52 46 66 54 72 C46 76 36 78 30 72Z\" fill=\"url(#lg1)\"><\u002Fpath>\n          <!-- Right arm -->\n          <path d=\"M90 72 C98 58 94 38 80 28 C70 20 60 22 60 22 C60 22 70 28 74 40 C78 52 74 66 66 72 C74 76 84 78 90 72Z\" fill=\"url(#lg2)\"><\u002Fpath>\n          <!-- Bottom left curve -->\n          <path d=\"M28 76 C24 82 28 92 38 90 C46 88 54 80 58 74 C52 72 40 74 28 76Z\" fill=\"url(#lg3)\" opacity=\"0.9\"><\u002Fpath>\n          <!-- Bottom right curve -->\n          <path d=\"M92 76 C96 82 92 92 82 90 C74 88 66 80 62 74 C68 72 80 74 92 76Z\" fill=\"url(#lg1)\" opacity=\"0.8\"><\u002Fpath>\n        <\u002Fsvg>\n        <span class=\"logo-itm-text\">ITeachMe<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n    <div class=\"logo-divider\"><\u002Fdiv>\n    <div class=\"logo-item\">\n      <img src=\"4d808e36-3d3f-4f45-bc86-e21e95d04017\" alt=\"Bridges &amp; Feelings\" class=\"logo-bridges\">\n    <\u002Fdiv>\n    <div class=\"logo-divider\"><\u002Fdiv>\n    <div class=\"logo-item\">\n      <img src=\"ddce614f-1698-46e0-9984-dc118519be45\" alt=\"Chevron\" class=\"logo-chevron\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"lang-toggle\">\n    <button class=\"lang-btn active\" onclick=\"setLang('ru')\">РУС<\u002Fbutton>\n    <button class=\"lang-btn\" onclick=\"setLang('kz')\">ҚАЗ<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ══ HERO ══ -->\n<div class=\"hero\">\n  <div class=\"hero-badge\">📚 Амбассадор Кит 2026<\u002Fdiv>\n  <h1>ITeachMe <span>8.0<\u002Fspan><\u002Fh1>\n  <p class=\"hero-sub\" data-lang=\"ru\">Ваш рабочий набор для проведения информационных кампаний по Казахстану. Здесь — всё, что нужно знать и сделать.<\u002Fp>\n  <p class=\"hero-sub\" data-lang=\"kz\">Қазақстан бойынша ақпараттық науқандар өткізуге арналған жұмыс жинағыңыз. Мұнда — білу және жасау керектің барлығы.<\u002Fp>\n  <div class=\"hero-stats\">\n    <div class=\"stat\">\n      <div class=\"stat-num\">20<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"ru\">регионов<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"kz\">өңір<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"stat-num\">2<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"ru\">профессии<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"kz\">мамандық<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"stat-num\">100%<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"ru\">бесплатно<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"kz\">тегін<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"stat-num\">Лето<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"ru\">2026<\u002Fdiv>\n      <div class=\"stat-label\" data-lang=\"kz\">2026 жыл<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ NAV ══ -->\n<nav class=\"nav-bar\" id=\"main-nav\">\n  <div class=\"nav-item active\" onclick=\"goToSection('about')\">\n    <span data-lang=\"ru\">О проекте<\u002Fspan>\n    <span data-lang=\"kz\">Жоба туралы<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('tz')\">\n    <span data-lang=\"ru\">Задачи<\u002Fspan>\n    <span data-lang=\"kz\">Міндеттер<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('instrukcia')\">\n    <span data-lang=\"ru\">Инструкция<\u002Fspan>\n    <span data-lang=\"kz\">Нұсқаулық<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('programma')\">\n    <span data-lang=\"ru\">Программа<\u002Fspan>\n    <span data-lang=\"kz\">Бағдарлама<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('tips')\">\n    <span data-lang=\"ru\">Советы<\u002Fspan>\n    <span data-lang=\"kz\">Кеңестер<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('kodex')\">\n    <span data-lang=\"ru\">Кодекс<\u002Fspan>\n    <span data-lang=\"kz\">Кодекс<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('otchet')\">\n    <span data-lang=\"ru\">Отчёт<\u002Fspan>\n    <span data-lang=\"kz\">Есеп<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"nav-item\" onclick=\"goToSection('contacts')\">\n    <span data-lang=\"ru\">Контакты<\u002Fspan>\n    <span data-lang=\"kz\">Байланыс<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ══ DRIVE BANNER ══ -->\n<div style=\"max-width:860px;margin:24px auto 0;padding:0 20px;\">\n  <div class=\"drive-banner\">\n    <div class=\"drive-banner-left\">\n      <div class=\"drive-banner-title\" data-lang=\"ru\">📁 Все материалы и документы<\u002Fdiv>\n      <div class=\"drive-banner-title\" data-lang=\"kz\">📁 Барлық материалдар мен құжаттар<\u002Fdiv>\n      <div class=\"drive-banner-sub\" data-lang=\"ru\">ТЗ, инструкции, программа, этикодекс, форма отчёта, презентация — всё в одном месте<\u002Fdiv>\n      <div class=\"drive-banner-sub\" data-lang=\"kz\">ТТ, нұсқаулықтар, бағдарлама, кодекс, есеп формасы, презентация — бәрі бір жерде<\u002Fdiv>\n    <\u002Fdiv>\n    <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"btn-drive\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z\"><\u002Fpath><\u002Fsvg>\n      <span data-lang=\"ru\">Открыть Google Drive<\u002Fspan>\n      <span data-lang=\"kz\">Google Drive ашу<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ MAIN ══ -->\n<main>\n\n  <!-- ABOUT -->\n  <div class=\"section-card open\" id=\"about\" data-screen-label=\"О проекте\">\n    <div class=\"section-header\" onclick=\"toggle(this)\">\n      <div class=\"section-icon icon-purple\">🌟<\u002Fdiv>\n      <div class=\"section-title-wrap\">\n        <div class=\"section-title\">\n          <span data-lang=\"ru\">О проекте ITeachMe 8.0<\u002Fspan>\n          <span data-lang=\"kz\">ITeachMe 8.0 жобасы туралы<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"section-desc\">\n          <span data-lang=\"ru\">Что это за проект и кто может участвовать<\u002Fspan>\n          <span data-lang=\"kz\">Бұл қандай жоба және кім қатыса алады<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"chevron-icon\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z\" clip-rule=\"evenodd\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"section-body\">\n      <div data-lang=\"ru\" class=\"content\">\n        <p><strong>ITeachMe 8.0<\u002Fstrong> — это образовательная программа Общественного фонда «ITeachMe». Мы обучаем людей с инвалидностью и социально уязвимые группы (СУСН) двум профессиям — с нуля, онлайн и полностью бесплатно. Проект охватывает все 20 регионов Казахстана.<\u002Fp>\n\n        <div class=\"about-grid\">\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🖥️<\u002Fdiv>\n            <div class=\"about-label\">Формат обучения<\u002Fdiv>\n            <div class=\"about-val\">Онлайн, бесплатно, с нуля<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🗺️<\u002Fdiv>\n            <div class=\"about-label\">География<\u002Fdiv>\n            <div class=\"about-val\">Все 20 регионов Казахстана<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">📅<\u002Fdiv>\n            <div class=\"about-label\">Период ваших ИК<\u002Fdiv>\n            <div class=\"about-val\">Лето 2026 года<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🎓<\u002Fdiv>\n            <div class=\"about-label\">Что получат участники<\u002Fdiv>\n            <div class=\"about-val\">2 профессии + поддержка команды<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"warn-box\">\n          ⏰ <strong>Важно про даты:<\u002Fstrong> Лето 2026 — это период <em>вашей работы как амбассадора<\u002Fem> (проведение ИК). Даты самого обучения в проекте уточняйте у менеджера — они могут отличаться.\n        <\u002Fdiv>\n\n        <h3>Кому помогает проект<\u002Fh3>\n        <div class=\"chips\">\n          <div class=\"chip\">👤 Люди с инвалидностью<\u002Fdiv>\n          <div class=\"chip\">📋 Социально уязвимые группы (СУСН)<\u002Fdiv>\n          <div class=\"chip\">🎓 Студенты и выпускники<\u002Fdiv>\n          <div class=\"chip\">🌱 Молодёжь от 18 лет<\u002Fdiv>\n          <div class=\"chip\">👪 Родители людей с инвалидностью<\u002Fdiv>\n          <div class=\"chip\">🤝 Представители НПО<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Что получают участники проекта<\u002Fh3>\n        <ul>\n          <li>Бесплатное онлайн-обучение с нуля двум востребованным профессиям<\u002Fli>\n          <li>Поддержку команды фонда на протяжении всего курса<\u002Fli>\n          <li>Новые цифровые и профессиональные навыки<\u002Fli>\n          <li>Возможности для трудоустройства, фриланса, самозанятости<\u002Fli>\n          <li>Сертификат по окончании обучения<\u002Fli>\n        <\u002Ful>\n\n        <h3>Кто финансирует<\u002Fh3>\n        <div class=\"info-box\">\n          Амбассадорская программа реализуется благодаря <strong>малому гранту от BRIDGES &amp; Feelings<\u002Fstrong>. Основной проект ITeachMe 8.0 поддерживается <strong>Chevron Kazakhstan<\u002Fstrong>. Обе организации верят в важность инклюзивного образования.\n        <\u002Fdiv>\n\n        <h3>Ваша роль в одной фразе<\u002Fh3>\n        <div class=\"cyan-box\">\n          <strong>Вы — голос проекта в своём регионе.<\u002Fstrong> Ваша задача — не просто рассказать о проекте, а показать людям, что для них это реальная возможность изменить жизнь.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-lang=\"kz\" class=\"content\">\n        <p><strong>ITeachMe 8.0<\u002Fstrong> — «ITeachMe» Қоғамдық қорының білім беру бағдарламасы. Біз мүгедектігі бар адамдарды және әлеуметтік осал топтарды (ӘОАТ) екі мамандыққа оқытамыз — нөлден бастап, онлайн және толығымен тегін. Жоба Қазақстанның барлық 20 өңірін қамтиды.<\u002Fp>\n\n        <div class=\"about-grid\">\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🖥️<\u002Fdiv>\n            <div class=\"about-label\">Оқыту форматы<\u002Fdiv>\n            <div class=\"about-val\">Онлайн, тегін, нөлден<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🗺️<\u002Fdiv>\n            <div class=\"about-label\">География<\u002Fdiv>\n            <div class=\"about-val\">Қазақстанның барлық 20 өңірі<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">📅<\u002Fdiv>\n            <div class=\"about-label\">НК кезеңі<\u002Fdiv>\n            <div class=\"about-val\">2026 жылғы жазы<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"about-item\">\n            <div class=\"about-icon\">🎓<\u002Fdiv>\n            <div class=\"about-label\">Қатысушылар не алады<\u002Fdiv>\n            <div class=\"about-val\">2 мамандық + команда қолдауы<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"warn-box\">\n          ⏰ <strong>Күндер туралы:<\u002Fstrong> 2026 жылғы жаз — бұл <em>амбассадор ретіндегі жұмысыңыздың кезеңі<\u002Fem> (НК өткізу). Жобадағы оқытудың нақты күндерін менеджерден біліңіз.\n        <\u002Fdiv>\n\n        <h3>Жоба кімге көмектеседі<\u002Fh3>\n        <div class=\"chips\">\n          <div class=\"chip\">👤 Мүгедектігі бар адамдар<\u002Fdiv>\n          <div class=\"chip\">📋 Әлеуметтік осал топтар (ӘОАТ)<\u002Fdiv>\n          <div class=\"chip\">🎓 Студенттер мен түлектер<\u002Fdiv>\n          <div class=\"chip\">🌱 18 жастан жоғары жастар<\u002Fdiv>\n          <div class=\"chip\">👪 Мүгедек адамдардың ата-аналары<\u002Fdiv>\n          <div class=\"chip\">🤝 ҮЕҰ өкілдері<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Қатысушылар не алады<\u002Fh3>\n        <ul>\n          <li>Нөлден бастап екі мамандыққа тегін онлайн оқыту<\u002Fli>\n          <li>Қор командасының бүкіл курс барысындағы қолдауы<\u002Fli>\n          <li>Жаңа цифрлық және кәсіби дағдылар<\u002Fli>\n          <li>Жұмысқа орналасу, фриланс, өзін-өзі жұмыспен қамту мүмкіндіктері<\u002Fli>\n          <li>Бағдарламаны аяқтағаннан кейін сертификат<\u002Fli>\n        <\u002Ful>\n\n        <h3>Сіздің рөліңіз бір сөйлеммен<\u002Fh3>\n        <div class=\"cyan-box\">\n          <strong>Сіз — жобаның өз өңіріңіздегі дауысысыз.<\u002Fstrong> Міндетіңіз — жоба туралы айып қана емес, адамдарға бұл олардың өмірін өзгертуге деген нақты мүмкіндік екенін көрсету.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- TZ -->\n  <div class=\"section-card\" id=\"tz\" data-screen-label=\"Задачи амбассадора\">\n    <div class=\"section-header\" onclick=\"toggle(this)\">\n      <div class=\"section-icon icon-purple\">📋<\u002Fdiv>\n      <div class=\"section-title-wrap\">\n        <div class=\"section-title\">\n          <span data-lang=\"ru\">Техническое задание амбассадора<\u002Fspan>\n          <span data-lang=\"kz\">Амбассадордың техникалық тапсырмасы<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"section-desc\">\n          <span data-lang=\"ru\">Что нужно сделать до, во время и после ИК<\u002Fspan>\n          <span data-lang=\"kz\">НК алдында, кезінде және одан кейін не жасау керек<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"chevron-icon\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z\" clip-rule=\"evenodd\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"section-body\">\n      <div data-lang=\"ru\" class=\"content\">\n        <div class=\"cyan-box\">\n          <strong>Главная идея:<\u002Fstrong> Амбассадор — это мост между проектом и людьми в регионе. Вы не одни: команда фонда всегда готова помочь с материалами, консультацией и любыми вопросами.\n        <\u002Fdiv>\n\n        <h3>Ваша цель<\u002Fh3>\n        <p>Представлять проект ITeachMe 8.0 в своём регионе, проводить встречи, распространять информацию и помогать людям понять, как участвовать. Главное — <strong>донести ценность проекта<\u002Fstrong>: показать, что это реальный шанс получить профессию и изменить жизнь.<\u002Fp>\n\n        <h3>Ваши задачи — шаг за шагом<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num\">1<\u002Fdiv><div>Изучите всю информацию о проекте: цели, условия, сроки, профессии — прочитайте этот кит полностью<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">2<\u002Fdiv><div>Составьте список мест в вашем городе/регионе, где можно провести встречи (колледжи, НПО, центры занятости, молодёжные центры)<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">3<\u002Fdiv><div>Договоритесь о встречах и проведите информационные кампании среди целевой аудитории<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">4<\u002Fdiv><div>Наладьте контакт с местными организациями: НПО, вузами, колледжами, центрами занятости<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">5<\u002Fdiv><div>Распространяйте материалы проекта — презентации, постеры, ссылки на анкету, публикации в соцсетях<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">6<\u002Fdiv><div>Помогайте заинтересованным людям заполнить заявку на участие<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">7<\u002Fdiv><div>Считайте охваченных людей и полученные заявки — это важно для отчётности<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">8<\u002Fdiv><div>После всех ИК заполните итоговый отчёт и передайте его команде фонда<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Форматы работы<\u002Fh3>\n        <div class=\"chips\">\n          <div class=\"chip cyan\">🏫 Офлайн встречи (приоритет)<\u002Fdiv>\n          <div class=\"chip cyan\">💻 Онлайн презентации<\u002Fdiv>\n          <div class=\"chip cyan\">🔀 Гибридный формат<\u002Fdiv>\n          <div class=\"chip cyan\">📱 Публикации в соцсетях<\u002Fdiv>\n          <div class=\"chip cyan\">💬 Рассылки по чатам<\u002Fdiv>\n          <div class=\"chip cyan\">🤝 Индивидуальные консультации<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Кого приглашать<\u002Fh3>\n        <ul>\n          <li>Люди с инвалидностью любого возраста<\u002Fli>\n          <li>Молодёжь от 18 лет, студенты и выпускники<\u002Fli>\n          <li>Люди в трудной жизненной ситуации (СУСН)<\u002Fli>\n          <li>Родители детей с инвалидностью<\u002Fli>\n          <li>Представители НПО и государственных органов<\u002Fli>\n        <\u002Ful>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Скачать ТЗ (полный документ)\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div data-lang=\"kz\" class=\"content\">\n        <div class=\"cyan-box\">\n          <strong>Негізгі идея:<\u002Fstrong> Амбассадор — жоба мен өңірдегі адамдар арасындағы көпір. Сіз жалғыз емессіз: қор командасы материалдар, кеңес және кез келген сұрақтар бойынша көмектесуге дайын.\n        <\u002Fdiv>\n\n        <h3>Міндеттер — қадамдап<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num\">1<\u002Fdiv><div>Жоба туралы барлық ақпаратты зерделеңіз: мақсаттар, шарттар, мерзімдер, мамандықтар<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">2<\u002Fdiv><div>Қалаңызда/өңіріңізде кездесу өткізуге болатын орындардың тізімін жасаңыз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">3<\u002Fdiv><div>Кездесулерді ұйымдастырып, мақсатты аудитория арасында ақпараттық науқандар өткізіңіз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">4<\u002Fdiv><div>Жергілікті ұйымдармен байланыс орнатыңыз: ҮЕҰ, колледждер, жұмыспен қамту орталықтары<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">5<\u002Fdiv><div>Жоба материалдарын таратыңыз — презентациялар, постерлер, өтінімге сілтемелер<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">6<\u002Fdiv><div>Қызығушылық танытқан адамдарға өтінімді толтыруға көмектесіңіз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">7<\u002Fdiv><div>Қамтылған адамдар мен алынған өтінімдердің санын есептеңіз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">8<\u002Fdiv><div>Барлық НК-дан кейін қорытынды есеп толтырып, қор командасына жіберіңіз<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Техникалық тапсырманы жүктеу (толық құжат)\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- INSTRUKCIA -->\n  <div class=\"section-card\" id=\"instrukcia\" data-screen-label=\"Инструкция по ИК\">\n    <div class=\"section-header\" onclick=\"toggle(this)\">\n      <div class=\"section-icon icon-blue\">📖<\u002Fdiv>\n      <div class=\"section-title-wrap\">\n        <div class=\"section-title\">\n          <span data-lang=\"ru\">Инструкция по проведению ИК<\u002Fspan>\n          <span data-lang=\"kz\">НК өткізу нұсқаулығы<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"section-desc\">\n          <span data-lang=\"ru\">Подготовка, проведение и завершение информационной кампании<\u002Fspan>\n          <span data-lang=\"kz\">Ақпараттық науқанды дайындау, өткізу және аяқтау<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"chevron-icon\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z\" clip-rule=\"evenodd\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"section-body\">\n      <div data-lang=\"ru\" class=\"content\">\n        <div class=\"info-box\">\n          <strong>Это подсказка, не жёсткий сценарий.<\u002Fstrong> Если возникает нестандартная ситуация — не паникуйте, обратитесь к команде фонда. Они помогут.\n        <\u002Fdiv>\n\n        <h3>До мероприятия<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Договоритесь с площадкой о дате, времени и формате встречи<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Получите все материалы от команды фонда: презентацию, QR-коды, постеры, шаблон отчёта<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Пригласите аудиторию — через соцсети, рассылки в чатах, партнёрские организации<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Распечатайте или подготовьте регистрационный лист<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Заранее проверьте технику: ноутбук, проектор, микрофон, Wi-Fi<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Прочитайте программу ИК и порепетируйте ключевые блоки (хотя бы вслух про себя)<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Во время мероприятия<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Встречайте людей, предлагайте им заполнить регистрационный лист при входе<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Фотографируйте и снимайте видео — материалы нужны для отчёта<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Ведите встречу по программе, но не бойтесь отступать если нужно<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Помогайте участникам сканировать QR-код или открыть анкету на телефоне<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Отвечайте на вопросы. Если не знаете ответа — честно скажите: «Уточню у команды»<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>После мероприятия<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num\">📱<\u002Fdiv><div>Опубликуйте пост о встрече в ваших соцсетях с хэштегами проекта<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">📊<\u002Fdiv><div>Заполните форму отчёта амбассадора<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">📤<\u002Fdiv><div>Отправьте фото, регистрационный лист и отчёт команде фонда<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Как спланировать встречу<\u002Fh3>\n        <table class=\"program-table\">\n          <thead><tr><th>Что продумать<\u002Fth><th>Что учесть<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><td><strong>Цель<\u002Fstrong><\u002Ftd><td>Информирование и привлечение участников к заявке<\u002Ftd><\u002Ftr>\n            <tr><td><strong>Аудитория<\u002Fstrong><\u002Ftd><td>Кому полезен проект: инвалиды, студенты, молодёжь, СУСН<\u002Ftd><\u002Ftr>\n            <tr><td><strong>Формат<\u002Fstrong><\u002Ftd><td>Офлайн — приоритет. Онлайн и гибрид — допустимо<\u002Ftd><\u002Ftr>\n            <tr><td><strong>Место<\u002Fstrong><\u002Ftd><td>Доступность, вместимость, наличие проектора<\u002Ftd><\u002Ftr>\n            <tr><td><strong>Время<\u002Fstrong><\u002Ftd><td>Удобное для вашей аудитории (не рабочие часы)<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Скачать инструкцию (полный документ)\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div data-lang=\"kz\" class=\"content\">\n        <div class=\"info-box\">\n          <strong>Бұл нұсқаулық — ұсыным, қатаң сценарий емес.<\u002Fstrong> Стандартты емес жағдай туындаса — үрейленбеңіз, қор командасына хабарласыңыз. Олар көмектеседі.\n        <\u002Fdiv>\n\n        <h3>Іс-шараға дейін<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Алаңмен күн, уақыт және формат туралы келісіңіз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Қор командасынан барлық материалдарды алыңыз: презентация, QR-кодтар, постерлер<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Аудиторияны шақырыңыз — әлеуметтік желілер, чат-рассылкалар, серіктес ұйымдар арқылы<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Тіркеу парағын дайындаңыз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num green\">✓<\u002Fdiv><div>Жабдықты алдын ала тексеріңіз: ноутбук, проектор, микрофон, Wi-Fi<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Іс-шара кезінде<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Адамдарды қарсы алып, тіркеу парағын толтыруды ұсыныңыз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Фото және бейне түсіріңіз — есеп үшін материалдар қажет<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Қатысушыларға QR-кодты сканерлеуге немесе анкетаны ашуға көмектесіңіз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num orange\">▶<\u002Fdiv><div>Сұрақтарға жауап беріңіз. Білмесеңіз — «Команда жауап береді» деп айтыңыз<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3>Іс-шарадан кейін<\u002Fh3>\n        <div class=\"task-list\">\n          <div class=\"task-item\"><div class=\"task-num\">📱<\u002Fdiv><div>Жоба хэштегтерімен кездесу туралы пост жариялаңыз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">📊<\u002Fdiv><div>Амбассадор есеп формасын толтырыңыз<\u002Fdiv><\u002Fdiv>\n          <div class=\"task-item\"><div class=\"task-num\">📤<\u002Fdiv><div>Фото, тіркеу парағы мен есепті қор командасына жіберіңіз<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Нұсқаулықты жүктеу (толық құжат)\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- PROGRAMMA -->\n  <div class=\"section-card\" id=\"programma\" data-screen-label=\"Программа ИК\">\n    <div class=\"section-header\" onclick=\"toggle(this)\">\n      <div class=\"section-icon icon-cyan\">🗓️<\u002Fdiv>\n      <div class=\"section-title-wrap\">\n        <div class=\"section-title\">\n          <span data-lang=\"ru\">Программа информационной кампании<\u002Fspan>\n          <span data-lang=\"kz\">Ақпараттық науқан бағдарламасы<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"section-desc\">\n          <span data-lang=\"ru\">Пошаговый сценарий встречи — примерно 40–50 минут<\u002Fspan>\n          <span data-lang=\"kz\">Кездесудің қадамдық сценарийі — шамамен 40–50 минут<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg class=\"chevron-icon\" viewBox=\"0 0 20 20\" fill=\"currentColor\"><path fill-rule=\"evenodd\" d=\"M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z\" clip-rule=\"evenodd\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"section-body\">\n      <div data-lang=\"ru\" class=\"content\">\n        <p>Площадки: университеты, колледжи, молодёжные хабы, НПО, центры занятости и другие. <strong>Цель:<\u002Fstrong> информировать, привлечь участников и помочь им подать заявку.<\u002Fp>\n\n        <table class=\"program-table\">\n          <thead>\n            <tr><th style=\"width:100px\">Время<\u002Fth><th style=\"width:160px\">Блок<\u002Fth><th>Что делать и говорить<\u002Fth><\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr>\n              <td><span class=\"time-badge\">5 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Техподготовка<\u002Fstrong><\u002Ftd>\n              <td>Подключите ноутбук, проектор, проверьте микрофон и Wi-Fi. Встречайте людей у входа. Раздайте регистрационные листы. Сделайте первые фото.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">5 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Приветствие<\u002Fstrong><\u002Ftd>\n              <td>Начните с простого вопроса: <em>«Слышали ли вы раньше о проекте ITeachMe?»<\u002Fem><br>Кратко представьтесь и объясните цель встречи. Говорите спокойно, создайте дружескую атмосферу — люди должны чувствовать себя комфортно.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">10 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Зачем это нужно<\u002Fstrong><\u002Ftd>\n              <td>Расскажите, почему цифровые навыки важны сегодня. Обозначьте проблемы, с которыми сталкиваются люди с инвалидностью и СУСН: нет доступного обучения, нет поддержки при трудоустройстве. Можно привести пример из вашего региона.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">10 мин<\u002Fspan><\u002Ftd>\n              <td><strong>О проекте ITeachMe 8<\u002Fstrong><\u002Ftd>\n              <td>Презентуйте проект. Акцентируйте: обучение бесплатное, онлайн, для людей без опыта. Главное — желание учиться. Покажите слайды.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">7 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Как подать заявку<\u002Fstrong><\u002Ftd>\n              <td>Покажите QR-код или ссылку. Объясните шаги: перейти → выбрать язык → заполнить данные → отправить. Помогите тем, у кого возникли трудности прямо на месте.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">10 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Вопросы и ответы<\u002Fstrong><\u002Ftd>\n              <td>Ответьте на вопросы. Сложные — честно скажите: «Уточню у команды и отвечу». Поблагодарите участников. Напомните про хэштеги и попросите поделиться информацией.<\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n\n        <div class=\"cyan-box\">\n          <strong>💡 Совет:<\u002Fstrong> Говорите чётко и не спешите. Паузы — ваш друг: они дают людям время осмыслить услышанное. Если чувствуете волнение — сделайте глубокий вдох, улыбнитесь.\n        <\u002Fdiv>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Скачать программу ИК\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div data-lang=\"kz\" class=\"content\">\n        <p>Алаңдар: университеттер, колледждер, жастар хабтары, ҮЕҰ, жұмыспен қамту орталықтары және басқалар.<\u002Fp>\n\n        <table class=\"program-table\">\n          <thead>\n            <tr><th style=\"width:90px\">Уақыт<\u002Fth><th style=\"width:150px\">Блок<\u002Fth><th>Не жасау керек<\u002Fth><\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr>\n              <td><span class=\"time-badge\">5 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Техдайындық<\u002Fstrong><\u002Ftd>\n              <td>Ноутбук, проекторды қосыңыз, микрофон мен Wi-Fi тексеріңіз. Адамдарды қарсы алыңыз. Тіркеу парақтарын таратыңыз. Алғашқы фотолар.<\u002Ftd>\n            <\u002Ftr>\n            <tr>\n              <td><span class=\"time-badge\">5 мин<\u002Fspan><\u002Ftd>\n              <td><strong>Сәлемдесу<\u002Fstrong><\u002Ftd>\n              <td>Қарапайым сұрақтан бастаңыз: <em>«ITeachMe жобасы туралы бұрын естідіңіз бе?»<\u002Fem> Қысқаша өзіңізді таныстырып, кездесудің мақсатын түсіндіріңіз.<\u002Ftd>\n            <\u002Ftr>\n TeachMe 8.0 в своём регионе.<\u002Fstrong> То, как вы говорите и ведёте себя, формирует впечатление о всём фонде.\n        <\u002Fdiv>\n\n        <div class=\"ethics-article\">\n          <h4>1. Честность и достоверность<\u002Fh4>\n          <p>Распространяйте только официальную и проверенную информацию о проекте. Не давайте обещаний или гарантий, которые не предусмотрены проектом. Если не знаете ответа — скажите честно и уточните у команды.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>2. Уважение к каждому человеку<\u002Fh4>\n          <p>Относитесь ко всем участникам с уважением — независимо от инвалидности, возраста, пола, национальности, религии или социального статуса. Любая форма дискриминации недопустима.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>3. Инклюзивность и доступность<\u002Fh4>\n          <p>Обеспечивайте комфортную и доступную среду для всех. Проверьте доступность площадки для людей с ограниченными возможностями заранее. Говорите ясно и понятно.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>4. Конфиденциальность данных<\u002Fh4>\n          <p>Персональные данные участников (ФИО, контакты, сведения о здоровье) можно передавать только в соответствии с требованиями фонда. Никому постороннему.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>5. Представление фонда<\u002Fh4>\n          <p>Действуйте в интересах ОФ «ITeachMe». Не используйте статус амбассадора в личных коммерческих целях. В публичных высказываниях придерживайтесь официальной позиции фонда.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>6. Открытость с командой<\u002Fh4>\n          <p>Сообщайте команде фонда о значимых событиях, трудностях и нестандартных ситуациях. Не решайте конфликты в одиночку — обращайтесь к менеджеру проекта.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>7. Точная отчётность<\u002Fh4>\n          <p>Честно фиксируйте данные о проведённых мероприятиях. Предоставляйте достоверную отчётность в установленные сроки.<\u002Fp>\n        <\u002Fdiv>\n\n        <a href=\"https://drive.google.com/drive/folders/18zRweCiUKTPjC3bAktPCXiec9ShkoNeg?usp=sharing\" target=\"_blank\" class=\"doc-link\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z\"><\u002Fpath><\u002Fsvg>\n          Скачать этический кодекс\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div data-lang=\"kz\" class=\"content\">\n        <div class=\"cyan-box\">\n          <strong>Амбассадор — бұл өз өңіріндегі ITeachMe 8.0 жобасының беті.<\u002Fstrong> Сіздің сөзіңіз бен мінез-құлқыңыз бүкіл қор туралы пікір қалыптастырады.\n        <\u002Fdiv>\n\n        <div class=\"ethics-article\">\n          <h4>1. Адалдық және сенімділік<\u002Fh4>\n          <p>Жоба туралы тек ресми және тексерілген ақпарат таратыңыз. Жобада қарастырылмаған уәделер немесе кепілдіктер бермеңіз.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>2. Әр адамға құрмет<\u002Fh4>\n          <p>Барлық қатысушыларға — мүгедектігіне, жасына, жынысына, ұлтына, дініне немесе әлеуметтік мәртебесіне қарамастан — құрметпен қараңыз.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>3. Инклюзивтілік<\u002Fh4>\n          <p>Барлығы үшін қолайлы және қолжетімді орта қамтамасыз етіңіз. Алаңның мүмкіндігі шектеулі адамдар үшін қолжетімділігін алдын ала тексеріңіз.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>4. Деректердің құпиялылығы<\u002Fh4>\n          <p>Қатысушылардың жеке деректерін тек қор талаптарына сәйкес тарата аласыз. Бөтен адамдарға — ешқашан.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"ethics-article\">\n          <h4>5. Дәл есептілік<\u002Fh4>\n          <p>Ө header.closest('.section-card');\n    card.classList.toggle('open');\n  }\n\n  function goToSection(id) {\n    var el = document.getElementById(id);\n    if (!el) return;\n    if (!el.classList.contains('open')) el.classList.add('open');\n    var top = el.getBoundingClientRect().top + window.pageYOffset - 140;\n    window.scrollTo({ top: top, behavior: 'smooth' });\n    // update nav\n    document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });\n    var navItems = document.querySelectorAll('.nav-item');\n    var sectionIds = ['about','tz','instrukcia','programma','tips','kodex','otchet','contacts'];\n    var idx = sectionIds.indexOf(id);\n    if (idx >= 0 && navItems[idx]) navItems[idx].classList.add('active');\n  }\n\n  function init() {\n    var saved;\n    try { saved = localStorage.getItem('itm_lang'); } catch(e) {}\n    setLang(saved === 'kz' ? 'kz' : 'ru');\n  }\n\n  // Highlight nav on scroll\n  window.addEventListener('scroll', function() {\n    var ids = ['about','tz','instrukcia','programma','tips','kodex','otchet','contacts'];\n    var active = 0;\n    ids.forEach(function(id, i) {\n      var el = document.getElementById(id);\n      if (el && el.getBoundingClientRect().top < 180) active = i;\n    });\n    document.querySelectorAll('.nav-item').forEach(function(n, i) {\n      n.classList.toggle('active', i === active);\n    });\n  }, { passive: true });\n\n  // Add \"prezentacia\" nav entry programmatically so scroll tracking works\n  init();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
